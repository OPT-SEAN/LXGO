<style>
  :root {
    --sky: #a8d8f8;
    --ink: #3b2f22;
    --ink-soft: #6d5d49;
    --cream: rgba(255, 250, 236, 0.92);
    --board: #2f4a3c;

    --berry: #e3342f;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;

  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;

    background: var(--board); color: var(--chalk); border: 5px solid #b8804a; border-radius: 10px;

  .toast {

  }
  .toast small { display: block; font-family: "Noto Sans SC", sans-serif; font-size: 13px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0; }
  .bubble {
    position: fixed; z-index: 2; transform: translate(-50%, -100%); pointer-events: none;
    font-family: "ZCOOL KuaiLe", sans-serif; font-size: 34px; color: var(--berry);
    background: #fff; border-radius: 50%; width: 46px; height: 46px; display: grid; place-items: center;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
  }
  .help {
    position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 2;
    max-width: calc(100% - 32px); box-sizing: border-box; background: var(--cream); border-radius: 12px;
    padding: 8px 12px; font-size: 12px; line-height: 1.7; color: var(--ink-soft); pointer-events: none;
  }
  .help b { color: var(--ink); font-weight: 500; }
  .end { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px; background: rgba(168, 216, 248, 0.45); }
  .end .card {
    width: 100%; max-width: 340px; box-sizing: border-box; background: var(--cream); border-radius: 22px;

  .end h2 { margin: 0; font-family: "ZCOOL KuaiLe", sans-serif; font-weight: 400; font-size: 30px; }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 模型路径：仓库里直接读 .glb；发布成网页时换成把 glb 以 base64 包起来的 .json
const ASSETS = {
  girl: 'models/girl_rigged.glb',
  planter: 'models/env_web/planter.glb', fence: 'models/env_web/fence.glb', tree: 'models/env_web/tree.glb',
  sign: 'models/env_web/sign.glb', chalkboard: 'models/env_web/chalkboard.glb', flowers: 'models/env_web/flowers.glb',
  stone: 'models/env_web/stone.glb', basket: 'models/env_web/basket.glb',
};

const $ = (id) => document.getElementById(id);
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#d9efff');
scene.fog = new THREE.Fog(HORIZON, 9, 22);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 80);

// ---------- 光照：环境贴图提供柔和统一的环境光 + 一盏暖色太阳投影 ----------
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight('#dff1ff', '#6fa84a', 0.3));
const sun = new THREE.DirectionalLight('#fff0d6', 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
scene.add(sun, sun.target);

// ---------- 天空：顶部天蓝到地平线浅蓝的渐变球 + 几朵慢慢飘的云 ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#6fbef5') }, bottom: { value: HORIZON } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y * 1.6, 0., 1.); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.7)), 1.); }',
}));
scene.add(sky);
const clouds = new THREE.Group();
{
  const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, emissive: '#ffffff', emissiveIntensity: 0.35 });
  const geo = new THREE.SphereGeometry(1, 16, 12);
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 5; k++) {
      const b = new THREE.Mesh(geo, mat);
      b.scale.set(1 + Math.random() * 0.8, 0.7 + Math.random() * 0.4, 0.9);
      b.position.set((k - 2) * 1.1, Math.random() * 0.4, Math.random() * 0.5);
      c.add(b);
    }
    c.position.set(-20 + i * 7 + Math.random() * 3, 7 + Math.random() * 3, -22 - Math.random() * 6);
    c.scale.setScalar(0.8 + Math.random() * 0.6);
    clouds.add(c);
  }
  scene.add(clouds);
}

// ---------- 地面 + 随风摆动的草 ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: '#5fa83c', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const BEDS = [[-1.05, -0.85], [1.05, -0.85], [-1.05, 0.35]].map(([x, z]) => ({ x, z, hw: 0.67, hd: 0.3 }));
const PATH = (z) => 0.12 * Math.sin(-z * 1.3);  // 石板路的中心线 x

const wind = { value: 0 };
function makeGrass() {
  // 每根草是一个上窄下宽的三段细条，InstancedMesh 一次画几万根；在顶点着色器里按高度加风
  const g = new THREE.BufferGeometry();
  const segs = 3, w = 0.012;
  const pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, ww = w * (1 - t * 0.85);
    pos.push(-ww, t, 0, ww, t, 0);
    if (i < segs) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, side: THREE.DoubleSide });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = wind;
    sh.vertexShader = 'uniform float uTime;\nvarying float vH;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vH = position.y;
      vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.);
      float sway = sin(uTime * 1.6 + wp.x * 1.3 + wp.z * 0.9) * 0.5 + sin(uTime * 2.7 + wp.x * 3.1) * 0.2;
      transformed.x += sway * position.y * position.y * 0.35;
      transformed.z += sway * position.y * position.y * 0.15;`);
    sh.fragmentShader = 'varying float vH;\n' + sh.fragmentShader.replace('#include <color_fragment>', `
      #include <color_fragment>
      diffuseColor.rgb *= mix(vec3(0.2, 0.42, 0.1), vec3(0.5, 0.78, 0.26), vH);`);
  };
  const N = 38000;
  const mesh = new THREE.InstancedMesh(g, mat, N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let n = 0;
  while (n < N) {
    const r = Math.sqrt(Math.random()) * 9, a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r * 0.9 - 0.5;
    if (Math.abs(x - PATH(z)) < 0.28 && z > -1.45 && z < 2.2) continue;  // 小路上不长草
    if (BEDS.some((b) => Math.abs(x - b.x) < b.hw && Math.abs(z - b.z) < b.hd)) continue;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI);
    const h = 0.05 + Math.random() * 0.07;
    s.set(1, h, 1);
    p.set(x, 0, z);
    mesh.setMatrixAt(n++, m.compose(p, q, s));
  }
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(makeGrass());

// ---------- 加载模型 ----------
// 发布版把 glb 以 base64 放在 .json 里，页面自己解码后交给 GLTFLoader.parse，
// 不经过 fetch(data:) / fetch(blob:)，页面的安全策略就不会拦。
const loader = new GLTFLoader();
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} 读取失败（${res.status}）`);
  let buf;
  if (url.endsWith('.json')) {
    const bin = atob((await res.json()).glb);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    buf = u8.buffer;
  } else {
    buf = await res.arrayBuffer();
  }
  // r160 的 GLTFLoader 在 Chrome 里用 createImageBitmap + fetch(blob:) 读贴图，同样会被拦；
  // 临时隐藏 createImageBitmap，让它改用 <img> 读贴图
  const cib = window.createImageBitmap;
  window.createImageBitmap = undefined;
  try {
    return await loader.parseAsync(buf, '');
  } finally {
    window.createImageBitmap = cib;
  }
}

function prep(root, { shadow = true } = {}) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = shadow; o.receiveShadow = true;
    const m = o.material;
    if (m) { m.envMapIntensity = 0.45; if (m.metalness !== undefined) m.metalness = 0; }
  });
  return root;
}

// 按包围盒缩放：让道具的某一边等于目标尺寸，并把底部放到地面
function fit(obj, { height, width, axis } = {}) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const k = height ? height / size.y : width / (axis === 'z' ? size.z : Math.max(size.x, size.z));
  obj.scale.multiplyScalar(k);
  const box2 = new THREE.Box3().setFromObject(obj);
  const c = box2.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box2.min.y;
  const wrap = new THREE.Group();
  wrap.add(obj);
  return wrap;
}

function chalkText(lines, w = 512, h = 384) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.draw = (ls) => {
    g.clearRect(0, 0, w, h);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    ls.forEach(([text, size, color, y]) => {
      g.font = `${size}px "ZCOOL KuaiLe", "Noto Sans SC", sans-serif`;
      g.fillStyle = color;
      g.fillText(text, w / 2, y);
    });
    tex.needsUpdate = true;
  };
  tex.draw(lines);
  return tex;
}

let boardTex = null;
function buildGarden(M) {
  const add = (o, x, z, rotY = 0) => { o.position.set(x, 0, z); o.rotation.y = rotY; scene.add(o); return o; };
  // 种植床：长边沿 x
  for (const b of BEDS) {
    const p = prep(M.planter.clone(true));
    const sz = new THREE.Box3().setFromObject(p).getSize(new THREE.Vector3());
    const w = fit(p, { width: 1.35 });
    add(w, b.x, b.z, sz.z > sz.x ? Math.PI / 2 : 0);
  }
  // 栅栏：一段约 1 米，门口留空
  for (const x of [-1.9, -0.9, 0.9, 1.9]) add(fit(prep(M.fence.clone(true)), { height: 0.46 }), x, -1.5);
  for (const z of [-0.95, 0.05, 1.05]) {
    add(fit(prep(M.fence.clone(true)), { height: 0.46 }), -2.45, z, Math.PI / 2);
    add(fit(prep(M.fence.clone(true)), { height: 0.46 }), 2.45, z, Math.PI / 2);
  }
  // 树
  [[-2.9, -4.0, 2.3], [3.0, -4.3, 2.6], [-0.9, -5.4, 2.2], [1.3, -6.0, 2.4], [-4.4, -1.8, 2.5],
   [4.5, -1.4, 2.2], [-4.9, -5.2, 2.8], [5.1, -5.6, 2.6]].forEach(([x, z, h], i) =>
    add(fit(prep(M.tree.clone(true)), { height: h }), x, z, i * 1.7));
  // 木牌「草莓园」
  const sign = add(fit(prep(M.sign.clone(true)), { height: 0.95 }), -0.75, -1.35, 0);
  {
    const tex = chalkText([['草莓园', 150, '#5a3a22', 190]], 512, 384);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.3), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    const bb = new THREE.Box3().setFromObject(sign);
    plate.position.set(-0.75, bb.min.y + (bb.max.y - bb.min.y) * 0.72, bb.max.z + 0.005);
    scene.add(plate);
  }
  // 小黑板：实时显示今日采摘数
  const board = fit(prep(M.chalkboard.clone(true)), { height: 0.8 });
  {
    // 在摆放之前（原点、未旋转）量板面位置：板面大约在整体高度 55% 处、前后居中偏前
    const bb = new THREE.Box3().setFromObject(board);
    boardTex = chalkText([['今日采摘', 86, '#f6f2e6', 120], ['0 / 20', 110, '#f47c7c', 250]]);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.26), new THREE.MeshBasicMaterial({ map: boardTex, transparent: true }));
    plate.position.set((bb.min.x + bb.max.x) / 2, bb.min.y + (bb.max.y - bb.min.y) * 0.56, bb.max.z * 0.55 + 0.01);
    plate.rotation.x = -0.12;
    board.add(plate);
  }
  add(board, 1.6, -0.1, -0.35);
  // 草莓篮（装饰）
  add(fit(prep(M.basket.clone(true)), { height: 0.3 }), 1.15, 0.45, 0.5);
  // 小花丛
  [[-1.9, 1.2], [-2.1, 0.6], [1.9, 1.3], [2.1, 0.8], [-0.6, 1.9], [0.8, 1.8], [-2.0, -0.4], [2.1, -0.9],
   [-0.35, -0.95], [0.4, -1.05]].forEach(([x, z], i) =>
    add(fit(prep(M.flowers.clone(true)), { height: 0.26 + (i % 3) * 0.04 }), x, z, i * 2.1));
  // 石板路
  for (let z = 2.1; z > -1.5; z -= 0.26) {
    for (const s of [-1, 1]) {
      const st = fit(prep(M.stone.clone(true), { shadow: false }), { width: 0.2 + Math.random() * 0.05 });
      st.scale.y = 0.35;
      add(st, PATH(z) + s * 0.11 + (Math.random() - 0.5) * 0.04, z + (Math.random() - 0.5) * 0.05, Math.random() * 3);
    }
  }
}

// ---------- 可以摘的草莓 ----------
const berryGeo = (() => {
  const g = new THREE.SphereGeometry(1, 16, 12);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const f = y < 0 ? 1 + 0.5 * y : 1 - 0.15 * y * y;
    p.setXYZ(i, x * f, y < 0 ? y * 1.15 : y * 0.9, z * f);
  }
  g.computeVertexNormals();
  return g;
})();
const leafGeo = new THREE.SphereGeometry(1, 8, 6);
const leafMat = new THREE.MeshStandardMaterial({ color: '#4f9a3c', roughness: 0.7 });
function makeBerry() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(berryGeo, new THREE.MeshStandardMaterial({ color: '#e3342f', roughness: 0.3 }));
  body.castShadow = true;
  g.add(body);
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * Math.PI * 2;
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    leaf.scale.set(0.16, 0.06, 0.42);
    leaf.position.set(Math.cos(a) * 0.32, 0.9, Math.sin(a) * 0.32);
    leaf.rotation.set(0.35, -a + Math.PI / 2, 0);
    g.add(leaf);
  }
  g.scale.setScalar(0.042);
  return g;
}
let berries = [];
function spawnBerries() {
  berries.forEach((b) => scene.remove(b.mesh));
  berries = [];
  BEDS.forEach((bed, bi) => {
    for (let i = 0; i < 5; i++) {
      const spots = [[0, 0.2]];
      if (bi === 2) spots.push([0.07, -0.2]);
      spots.forEach(([dx, dz]) => {
        const m = makeBerry();
        m.position.set(bed.x - 0.5 + i * 0.25 + dx, 0.36, bed.z + dz);
        m.rotation.y = Math.random() * Math.PI * 2;
        scene.add(m);
        berries.push({ mesh: m, alive: true, phase: Math.random() * 6, y: 0.36 });
      });
    }
  });
  $('goal').textContent = berries.length;
}

// ---------- 女孩与动画 ----------
let girl = null, mixer = null;
const actions = {};
const state = { mode: 'idle', heading: 0, target: null, autoPick: null, anim: null };
const stats = { picked: 0, basket: 0, eaten: 0 };

function play(name, fade = 0.2) {
  const next = actions[name];
  if (!next || state.anim === name) return;
  const prev = actions[state.anim];
  next.reset().play();
  if (prev) prev.crossFadeTo(next, fade, false);
  state.anim = name;
}
function playOnce(name, onDone) {
  const act = actions[name];
  act.setLoop(THREE.LoopOnce, 1);
  act.clampWhenFinished = true;
  const prev = actions[state.anim];
  act.reset().play();
  if (prev && prev !== act) prev.crossFadeTo(act, 0.15, false);
  state.anim = name;
  const done = (e) => {
    if (e.action !== act) return;
    mixer.removeEventListener('finished', done);
    onDone && onDone();
    if (state.mode !== 'caught' || name === 'Caught') { state.mode = 'idle'; play('Idle', 0.25); }
  };
  mixer.addEventListener('finished', done);
  return act.getClip().duration;
}

// ---------- 输入 ----------
const keys = new Set();
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'KeyE' || e.code === 'Space') { tryPick(); e.preventDefault(); }
  if (e.code === 'KeyQ') tryEat();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
$('btnPick').addEventListener('click', () => tryPick());
$('btnEat').addEventListener('click', () => tryEat());

const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
canvas.addEventListener('pointerdown', (e) => {
  if (!girl || busy()) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(berries.filter((b) => b.alive).map((b) => b.mesh), true);
  if (hits.length) {
    const b = berries.find((bb) => bb.mesh === hits[0].object.parent);
    if (b) { state.target = b.mesh.position.clone(); state.autoPick = b; return; }
  }
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(groundPlane, p)) { state.target = p; state.autoPick = null; }
});

// ---------- 玩法 ----------
const busy = () => ['pick', 'eat', 'caught'].includes(state.mode);
function nearestBerry(maxDist = 0.65) {
  let best = null, bd = maxDist;
  for (const b of berries) {
    if (!b.alive) continue;
    const d = Math.hypot(b.mesh.position.x - girl.position.x, b.mesh.position.z - girl.position.z);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function faceTo(p) { state.heading = Math.atan2(p.x - girl.position.x, p.z - girl.position.z); }
function tryPick() {
  if (!girl || busy()) return;
  const b = nearestBerry();
  if (!b) { toast('附近没有草莓', '走到种植床边上再摘'); return; }
  faceTo(b.mesh.position);
  state.mode = 'pick'; state.target = null;
  const dur = playOnce('Pick');
  b.alive = false;
  b.flyAt = performance.now() + dur * 450;
  b.flyDur = 350;
}
function tryEat() {
  if (!girl || busy()) return;
  if (stats.basket <= 0) { toast('篮子是空的', '先去摘几颗'); return; }
  state.mode = 'eat'; state.target = null;
  const dur = playOnce('Eat', () => { if (Math.random() < 0.35) caught(); });
  setTimeout(() => { stats.basket--; stats.eaten++; updateHud(); toast('好甜！', '偷偷吃掉了一颗'); }, dur * 400);
}
function caught() {
  state.mode = 'caught';
  playOnce('Caught', () => { $('bubble').hidden = true; });
  $('bubble').hidden = false;
  toast('被发现了！', '「请勿偷吃！」——快装作什么都没发生');
}
function updateHud() {
  $('picked').textContent = stats.picked;
  $('basket').textContent = stats.basket;
  $('eaten').textContent = stats.eaten;
  $('btnEat').disabled = stats.basket <= 0;
  boardTex && boardTex.draw([['今日采摘', 86, '#f6f2e6', 120], [`${stats.picked} / ${berries.length}`, 110, '#f47c7c', 250]]);
  if (stats.picked >= berries.length && berries.length) {
    setTimeout(() => {
      $('endText').textContent = stats.eaten
        ? `一共摘了 ${stats.picked} 颗，其中偷吃了 ${stats.eaten} 颗。篮子里还剩 ${stats.basket} 颗。`
        : `一共摘了 ${stats.picked} 颗，一颗都没偷吃，真乖！`;
      $('end').hidden = false;
    }, 1600);
  }
}
$('again').addEventListener('click', () => {
  Object.assign(stats, { picked: 0, basket: 0, eaten: 0 });
  spawnBerries(); updateHud(); $('end').hidden = true;
});
let toastTimer = 0;
function toast(title, sub) {
  const t = $('toast');
  t.textContent = title;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; t.append(s); }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

// ---------- 移动与碰撞 ----------
const BOUNDS = { x0: -2.3, x1: 2.3, z0: -1.35, z1: 2.3 };
const OBST = [{ x: 1.6, z: -0.1, r: 0.3 }, { x: -0.75, z: -1.35, r: 0.35 }, { x: 1.15, z: 0.45, r: 0.2 }];
const RADIUS = 0.12;
function blocked(x, z) {
  if (x < BOUNDS.x0 || x > BOUNDS.x1 || z < BOUNDS.z0 || z > BOUNDS.z1) return true;
  if (BEDS.some((b) => Math.abs(x - b.x) < b.hw + RADIUS && Math.abs(z - b.z) < b.hd + RADIUS)) return true;
  return OBST.some((o) => Math.hypot(x - o.x, z - o.z) < o.r + RADIUS);
}
function move(dx, dz, dt, running) {
  const len = Math.hypot(dx, dz);
  if (len < 1e-3) return false;
  const speed = running ? 1.7 : 0.85;
  const sx = dx / len * speed * dt, sz = dz / len * speed * dt;
  const p = girl.position;
  if (!blocked(p.x + sx, p.z)) p.x += sx;
  if (!blocked(p.x, p.z + sz)) p.z += sz;
  state.heading = Math.atan2(dx, dz);
  return true;
}
function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// ---------- 后期：环境光遮蔽 + 轻微泛光 + 移轴模糊 + 调色 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 0.25, distanceExponent: 1, thickness: 1, scale: 1 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.18, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const TiltShiftGrade = {
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      // 移轴：画面上下边缘轻微模糊，中间清晰（动森那种小模型的感觉）
      float amt = smoothstep(0.28, 0.5, abs(vUv.y - 0.52)) * 2.2;
      vec4 c = vec4(0.);
      float tot = 0.;
      for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) {
        float w = exp(-float(i*i + j*j) / 8.);
        c += texture2D(tDiffuse, vUv + vec2(float(i), float(j)) * amt / uRes) * w; tot += w;
      }
      c /= tot;
      // 调色：略提饱和度、暖一点
      float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb = mix(vec3(l), c.rgb, 1.22) * vec3(1.02, 1.0, 0.97);
      c.rgb = (c.rgb - 0.5) * 1.06 + 0.5;
      gl_FragColor = c;
    }`,
};
const tilt = new ShaderPass(TiltShiftGrade);
composer.addPass(tilt);

function resize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  tilt.uniforms.uRes.value.set(w * pr, h * pr);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 50 : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- 启动 ----------
const names = Object.keys(ASSETS);
let loaded = 0;
Promise.all(names.map((n) => loadGLB(ASSETS[n]).then((g) => {
  $('status').textContent = `草莓园加载中… ${++loaded}/${names.length}`;
  return [n, g];
}))).then((list) => {
  const G = Object.fromEntries(list);
  const M = {};
  for (const n of names) if (n !== 'girl') M[n] = G[n].scene;
  buildGarden(M);
  girl = prep(G.girl.scene);
  girl.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  girl.position.set(0, 0, 1.2);
  scene.add(girl);
  mixer = new THREE.AnimationMixer(girl);
  G.girl.animations.forEach((clip) => { actions[clip.name] = mixer.clipAction(clip); });
  play('Idle');
  spawnBerries();
  updateHud();
  $('status').hidden = true;
  setTimeout(() => { $('help').hidden = true; }, 9000);
}).catch((err) => { $('status').textContent = '加载失败：' + (err && err.message ? err.message : err); });

const camOffset = new THREE.Vector3(0, 2.2, 3.5);
const camPos = new THREE.Vector3(0, 2.4, 4.9);
const look = new THREE.Vector3(0, 0.4, 1.2);
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  wind.value = now / 1000;
  clouds.children.forEach((c, i) => { c.position.x += dt * (0.12 + i * 0.01); if (c.position.x > 26) c.position.x = -26; });
  if (girl) {
    if (!busy()) {
      let dx = 0, dz = 0;
      if (keys.has('KeyW') || keys.has('ArrowUp')) dz -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) dz += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) dx -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) dx += 1;
      const shift = keys.has('ShiftLeft') || keys.has('ShiftRight');
      let moving = false, running = shift;
      if (dx || dz) {
        state.target = null;
        moving = move(dx, dz, dt, shift);
      } else if (state.target) {
        const tx = state.target.x - girl.position.x, tz = state.target.z - girl.position.z;
        const dist = Math.hypot(tx, tz);
        const reach = state.autoPick ? 0.5 : 0.06;
        if (dist > reach) {
          const before = girl.position.clone();
          running = dist > 1.2;
          moving = move(tx, tz, dt, running);
          if (girl.position.distanceTo(before) < 1e-4) { state.target = null; moving = false; }
        } else {
          state.target = null;
          if (state.autoPick) { state.autoPick = null; tryPick(); }
        }
      }
      if (!busy()) play(moving ? (running ? 'Run' : 'Walk') : 'Idle');
    }
    girl.rotation.y = angleLerp(girl.rotation.y, state.heading, Math.min(1, dt * 12));
    mixer.update(dt);

    camPos.lerp(girl.position.clone().add(camOffset), Math.min(1, dt * 3));
    camera.position.copy(camPos);
    look.lerp(girl.position.clone().add(new THREE.Vector3(0, 0.45, 0)), Math.min(1, dt * 4));
    camera.lookAt(look);
    sun.position.copy(girl.position).add(new THREE.Vector3(3, 6, 4));
    sun.target.position.copy(girl.position);

    const near = busy() ? null : nearestBerry();
    for (const b of berries) {
      const body = b.mesh.children[0];
      if (b.alive) {
        const glow = b === near ? 0.35 + 0.25 * Math.sin(now / 150) : 0;
        body.material.emissive.setRGB(glow, glow * 0.3, glow * 0.2);
        b.mesh.position.y = b.y + Math.sin(now / 500 + b.phase) * 0.004;
      } else if (b.flyAt && now >= b.flyAt) {
        const t = Math.min(1, (now - b.flyAt) / b.flyDur);
        b.mesh.position.lerp(girl.position.clone().add(new THREE.Vector3(0, 0.3, 0)), t * 0.5);
        b.mesh.scale.setScalar(0.042 * (1 - t));
        if (t >= 1) { scene.remove(b.mesh); b.flyAt = 0; stats.picked++; stats.basket++; updateHud(); }
      }
    }
    if (!$('bubble').hidden) {
      const head = girl.position.clone().add(new THREE.Vector3(0, 1.1, 0)).project(camera);
      $('bubble').style.left = `${(head.x + 1) / 2 * innerWidth}px`;
      $('bubble').style.top = `${(1 - head.y) / 2 * innerHeight}px`;
    }
  }
  composer.render();
}
requestAnimationFrame(tick);
</script>
