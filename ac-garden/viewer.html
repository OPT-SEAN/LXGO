<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>动森风草莓园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=ZCOOL+KuaiLe&display=swap">
<style>
  :root {
    --sky: #9fd3fb;
    --ink: #2f3a2a;
    --ink-soft: #56654f;
    --berry: #e3342f;
    --card: rgba(255, 253, 244, 0.8);
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--sky); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .tag {
    position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
    max-width: calc(100% - 32px); box-sizing: border-box;
    padding: 12px 16px; border-radius: 16px;
    background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; gap: 4px;
  }
  h1 { margin: 0; font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.04em; }
  h1 span { color: var(--berry); }
  .tag p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; gap: 8px;
  }
  .bar button {
    appearance: none; border: 0; cursor: pointer; white-space: nowrap;
    padding: 9px 16px; border-radius: 999px;
    font: 500 14px/1 "Noto Sans SC", sans-serif; color: var(--ink);
    background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .bar button[aria-pressed="true"] { background: var(--berry); color: #fff; }
  .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #status {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: calc(100% - 32px); box-sizing: border-box;
    padding: 10px 16px; border-radius: 12px; background: var(--card);
    font-size: 14px; color: var(--ink-soft); pointer-events: none;
  }
</style>

<canvas id="view"></canvas>
<div class="tag">
  <h1>动森风<span>草莓园</span></h1>
  <p>Blender 脚本建模 · 拖动旋转，滚轮或双指缩放</p>
</div>
<div class="bar">
  <button id="spin" type="button" aria-pressed="false">自动旋转</button>
  <button id="reset" type="button">回到正面</button>
</div>
<div id="status">加载中 0/4</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const EXT = 'glb';
  const BASE = 'output/';  // 模型所在目录（需通过 http 服务打开本页）
  // Blender 里的摆位（与 build.py 一致）。坐标换算：Blender (x, y, z) -> three (x, z, -y)
  const MODELS = [
    { file: 'garden', pos: [0, 0, 0], turn: 0 },
    { file: 'girl', pos: [0.0, -0.55], turn: 0 },
    { file: 'isabelle', pos: [-0.78, -0.95], turn: 28 },
    { file: 'nook', pos: [0.8, -0.85], turn: -28 },
  ];

  const canvas = document.getElementById('view');
  const status = document.getElementById('status');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const SKY = 0x9fd3fb;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  // 雾在着色器里会再做一次 sRGB 编码，先转成线性色才能和天空衔接
  scene.fog = new THREE.Fog(new THREE.Color(SKY).convertSRGBToLinear(), 7, 16);

  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 60);
  const HOME = new THREE.Vector3(0, 2.15, 4.3);
  const TARGET = new THREE.Vector3(0, 0.42, 0.65);
  camera.position.copy(HOME);

  scene.add(new THREE.HemisphereLight(0xe2f2ff, 0x6fa24a, 0.55));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.2);
  sun.position.set(2.5, 5, 3.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.minDistance = 1.2;
  controls.maxDistance = 8;
  controls.maxPolarAngle = Math.PI * 0.47;
  controls.autoRotateSpeed = 0.8;
  controls.update();

  // 页面的安全策略不允许 fetch() 读 blob: 地址，而 r128 的 GLTFLoader 在 Chrome 里
  // 会用 fetch + createImageBitmap 读内嵌贴图。临时隐藏 createImageBitmap，
  // 让它退回用 <img> 读贴图。
  const cib = window.createImageBitmap;
  window.createImageBitmap = undefined;
  const loader = new THREE.GLTFLoader();
  let done = 0;
  Promise.all(MODELS.map((m) => loader.loadAsync(`${BASE}${m.file}.${EXT}`).then((gltf) => {
    const root = gltf.scene;
    root.position.set(m.pos[0], 0, -m.pos[1]);
    root.rotation.y = THREE.MathUtils.degToRad(m.turn);
    root.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    scene.add(root);
    status.textContent = `加载中 ${++done}/${MODELS.length}`;
  }))).then(() => {
    status.hidden = true;
  }).catch((err) => {
    status.textContent = '模型没有加载成功：' + (err && err.message ? err.message : err);
  }).finally(() => {
    window.createImageBitmap = cib;
  });

  const spin = document.getElementById('spin');
  spin.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spin.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  document.getElementById('reset').addEventListener('click', () => {
    camera.position.copy(HOME);
    controls.target.copy(TARGET);
    controls.update();
  });

  function resize() {
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 55 : 32;  // 竖屏时放宽视角，保证三个角色都在画面里
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
