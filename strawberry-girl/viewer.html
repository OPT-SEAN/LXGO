<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>草莓园女孩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=ZCOOL+KuaiLe&display=swap">
<style>
  :root {
    --sky: #bfe0f7;
    --ink: #2f3a2a;
    --ink-soft: #5b6a55;
    --berry: #d8454a;
    --card: rgba(255, 255, 255, 0.72);
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--sky); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .tag {
    position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
    max-width: calc(100% - 32px); box-sizing: border-box;
    padding: 12px 16px; border-radius: 12px;
    background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; gap: 4px;
  }
  h1 { margin: 0; font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.04em; }
  h1 span { color: var(--berry); }
  .tag p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; gap: 8px;
  }
  .bar button {
    appearance: none; border: 0; cursor: pointer;
    padding: 9px 16px; border-radius: 999px;
    font: 500 14px/1 "Noto Sans SC", sans-serif; color: var(--ink);
    background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .bar button[aria-pressed="true"] { background: var(--berry); color: #fff; }
  .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-soft); pointer-events: none; }
</style>

<canvas id="view"></canvas>
<div class="tag">
  <h1>草莓园<span>女孩</span></h1>
  <p>Blender 脚本建模 · 拖动旋转，滚轮或双指缩放</p>
</div>
<div class="bar">
  <button id="spin" type="button" aria-pressed="true">自动旋转</button>
  <button id="reset" type="button">回到正面</button>
</div>
<div id="status">模型加载中…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const canvas = document.getElementById('view');
  const status = document.getElementById('status');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe0f7);
  // 雾在着色器里会再做一次 sRGB 编码，所以先转成线性色，才能和背景天空无缝衔接
  scene.fog = new THREE.Fog(new THREE.Color(0xbfe0f7).convertSRGBToLinear(), 6, 14);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
  const HOME = new THREE.Vector3(0.9, 0.95, 2.4);
  camera.position.copy(HOME);

  // 天空蓝 + 草地绿的半球光，加一盏暖色阳光投影
  scene.add(new THREE.HemisphereLight(0xdcefff, 0x6f9a4a, 0.5));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.15);
  sun.position.set(1.6, 3, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -1.2;
  sun.shadow.camera.right = sun.shadow.camera.top = 1.2;
  sun.shadow.bias = -0.0005;
  sun.shadow.radius = 4;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(0x86b85a).convertSRGBToLinear(), roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0.48, 0);
  controls.enableDamping = true;
  controls.minDistance = 0.8;
  controls.maxDistance = 5;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  controls.update();

  // 页面的安全策略不允许 fetch() 读 blob: 地址，而 r128 的 GLTFLoader 在 Chrome 里
  // 会用 fetch + createImageBitmap 读内嵌贴图。临时隐藏 createImageBitmap，
  // 让它退回用 <img> 标签读贴图（blob: 图片是允许的）。
  const cib = window.createImageBitmap;
  window.createImageBitmap = undefined;
  const loader = new THREE.GLTFLoader();
  loader.load('strawberry_girl.glb', (gltf) => {
    window.createImageBitmap = cib;
    gltf.scene.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    scene.add(gltf.scene);
    status.hidden = true;
  }, undefined, (err) => {
    window.createImageBitmap = cib;
    status.textContent = '模型没有加载成功：' + (err && err.message ? err.message : err);
  });

  const spin = document.getElementById('spin');
  spin.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spin.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  document.getElementById('reset').addEventListener('click', () => {
    camera.position.copy(HOME);
    controls.target.set(0, 0.48, 0);
    controls.update();
  });

  function resize() {
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 竖屏时视角放宽，保证全身都在画面里
    camera.fov = w / h < 0.8 ? 50 : 35;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
